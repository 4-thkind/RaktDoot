# One command: docker compose up --build
# Web: http://localhost:3000   API: http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: raktdoot
      POSTGRES_PASSWORD: raktdoot
      POSTGRES_DB: raktdoot
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raktdoot"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://raktdoot:raktdoot@db:5432/raktdoot
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}   # run.py sets the tunnel URL for phone links
      PUBLIC_API_BASE: ${PUBLIC_API_BASE:-http://localhost:8000}   # voice-reply links Twilio fetches
      TWILIO_WEBHOOK_URL: ${TWILIO_WEBHOOK_URL:-}                 # exact URL Twilio signs; run.py sets it
    volumes: [models:/root/.cache/huggingface]   # local Whisper model, downloaded once
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://127.0.0.1:8000/openapi.json', timeout=3); r.raise_for_status()"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      db: { condition: service_healthy }

  telegram:
    build: ./backend
    command: ["python", "-m", "app.telegram"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://raktdoot:raktdoot@db:5432/raktdoot
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
    depends_on:
      backend: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-}   # empty = same origin via the Next proxy
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
  models:
